<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Challenge Arena | Quanskill - 250 Coding Exercises</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --quanskill-blue: #0b2fa0;
            --quanskill-blue-dark: #081f6b;
            --quanskill-blue-light: #1a4fd0;
            --quanskill-orange: #ff9000;
            --quanskill-orange-dark: #e68200;
            --quanskill-orange-light: #ffab33;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --bg-primary: #fafbff;
            --bg-secondary: #ffffff;
            --border-color: #e8eaf6;
            --success: #10b981;
            --error: #ef4444;
            --gradient-blue: linear-gradient(135deg, #0b2fa0 0%, #1a4fd0 100%);
            --gradient-orange: linear-gradient(135deg, #ff9000 0%, #ffab33 100%);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* Layout */
        .app-container {
            display: flex;
            height: calc(100vh - 48px);
            overflow: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            width: 340px;
            background: var(--gradient-blue);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        /* Topic Filter */
        .topic-filter {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .filter-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        
        .filter-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .filter-select option {
            background: var(--quanskill-blue-dark);
            color: white;
        }
        
        /* Search */
        .search-box {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
        }
        
        .search-input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        /* Progress */
        .progress-section {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .progress-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .progress-count {
            color: var(--quanskill-orange);
            font-weight: 700;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--gradient-orange);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        /* Question List */
        .question-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        
        .question-item {
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
        }
        
        .question-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .question-item.active {
            background: white;
            border-color: var(--quanskill-orange);
        }
        
        .question-item.active .q-title {
            color: var(--quanskill-blue);
        }
        
        .question-item.active .q-topic {
            color: var(--text-secondary);
        }
        
        .question-item.completed {
            border-left: 4px solid var(--success);
        }
        
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }
        
        .q-number {
            background: var(--quanskill-orange);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        
        .question-item.active .q-number {
            background: var(--quanskill-blue);
        }
        
        .q-title {
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .q-meta {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        
        .q-topic {
            color: rgba(255,255,255,0.6);
            font-size: 0.75rem;
        }
        
        .q-difficulty {
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .q-difficulty.beginner {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .q-difficulty.intermediate {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        
        .q-difficulty.advanced {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .question-item.active .q-difficulty.beginner {
            background: rgba(16, 185, 129, 0.15);
        }
        
        .question-item.active .q-difficulty.intermediate {
            background: rgba(245, 158, 11, 0.15);
        }
        
        .question-item.active .q-difficulty.advanced {
            background: rgba(239, 68, 68, 0.15);
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        /* Main content scrollbar */
        .main-content::-webkit-scrollbar {
            width: 10px;
        }
        
        .main-content::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 5px;
        }
        
        .main-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 5px;
        }
        
        .main-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Question Panel */
        .question-panel {
            background: white;
            border-bottom: 3px solid var(--quanskill-orange);
            padding: 1rem 1.5rem;
            flex-shrink: 0;
        }
        
        .question-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        
        .question-title h2 {
            font-size: 1.25rem;
            color: var(--quanskill-blue);
        }
        
        .difficulty-badge {
            padding: 0.35rem 0.8rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .difficulty-badge.beginner {
            background: #dcfce7;
            color: #166534;
        }
        
        .difficulty-badge.intermediate {
            background: #fef3c7;
            color: #92400e;
        }
        
        .difficulty-badge.advanced {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .question-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .question-text code {
            background: #f1f5f9;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            color: var(--quanskill-blue);
        }
        
        /* Editor Panel */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem 1.5rem;
            background: var(--bg-primary);
        }
        
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .editor-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .editor-title h3 {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .status-badge.online {
            background: #dcfce7;
            color: #166534;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .editor-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background: #cbd5e1;
        }
        
        .btn-solution {
            background: var(--quanskill-blue);
            color: white;
        }
        
        .btn-solution:hover {
            background: var(--quanskill-blue-dark);
        }
        
        .btn-run {
            background: var(--quanskill-orange);
            color: white;
        }
        
        .btn-run:hover {
            background: var(--quanskill-orange-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 144, 0, 0.4);
        }
        
        .code-editor {
            flex: 1;
            min-height: 150px;
            max-height: 220px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            background: #1e293b;
            color: #a5f3fc;
            border: none;
            border-radius: 10px;
            resize: vertical;
            outline: none;
        }
        
        .code-editor:focus {
            box-shadow: 0 0 0 3px rgba(11, 47, 160, 0.2);
        }
        
        /* Output Panel */
        .output-panel {
            margin-top: 0.75rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }
        
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
        }
        
        .output-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        
        .output-status {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }
        
        .output-status.success {
            background: #dcfce7;
            color: #166534;
        }
        
        .output-status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .output-status.running {
            background: #e0f2fe;
            color: #0369a1;
        }
        
        .output-box {
            background: #1e293b;
            color: #e2e8f0;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 2px solid #334155;
        }
        
        .output-box.error {
            border-left: 4px solid var(--error);
        }
        
        .output-box.success {
            border-left: 4px solid var(--success);
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 280px;
            }
        }
        
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 40vh;
            }
            
            .question-list {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 0.5rem;
                gap: 0.5rem;
            }
            
            .question-item {
                min-width: 200px;
                margin-bottom: 0;
            }
        }
        
        /* Hint Section */
        .hint-section {
            margin-top: 0.75rem;
            padding: 0.6rem 0.8rem;
            background: #fffbeb;
            border-radius: 8px;
            border-left: 3px solid #f59e0b;
        }
        
        .hint-toggle {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #92400e;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
        }
        
        .hint-content {
            margin-top: 0.5rem;
            color: #78350f;
            font-size: 0.85rem;
            display: none;
        }
        
        .hint-content.show {
            display: block;
        }
        
        /* Top Header - New */
        .top-header {
            background: var(--gradient-blue);
            color: white;
            padding: 0.5rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(11, 47, 160, 0.3);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .header-logo img {
            height: 32px;
            border-radius: 6px;
        }
        
        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .header-title .badge {
            background: var(--quanskill-orange);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        
        .header-stats {
            display: flex;
            gap: 1.25rem;
        }
        
        .header-stat {
            text-align: center;
        }
        
        .header-stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--quanskill-orange);
        }
        
        .header-stat-label {
            font-size: 0.65rem;
            opacity: 0.8;
            text-transform: uppercase;
        }
        
        /* Floating Back Button */
        .floating-back-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--gradient-blue);
            color: white !important;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(11, 47, 160, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .floating-back-btn:hover {
            transform: translateY(-3px);
            background: var(--gradient-orange);
            box-shadow: 0 6px 20px rgba(255, 144, 0, 0.4);
        }
        
        /* Improved scrollbar for output */
        .output-box::-webkit-scrollbar {
            width: 10px;
        }
        
        .output-box::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 5px;
        }
        
        .output-box::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 5px;
            border: 2px solid #1e293b;
        }
        
        .output-box::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        /* Improved scrollbar for question list */
        .question-list::-webkit-scrollbar {
            width: 10px;
        }
        
        .question-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
        }
        
        .question-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            border: 2px solid transparent;
        }
        
        .question-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
        }
        
        @media (max-width: 1024px) {
            .header-stats {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .floating-back-btn {
                bottom: 15px;
                right: 15px;
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
            .top-header {
                padding: 0.5rem 1rem;
            }
            .header-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Top Header -->
    <header class="top-header">
        <div class="header-left">
            <div class="header-logo">
                <img src="Logo_for_Print.jpg" alt="Quanskill" onerror="this.style.display='none'">
            </div>
            <div class="header-title">
                📝† Python Challenge Arena <span class="badge">250 Exercises</span>
            </div>
        </div>
        <div class="header-stats">
            <div class="header-stat">
                <div class="header-stat-value">14</div>
                <div class="header-stat-label">Topics</div>
            </div>
            <div class="header-stat">
                <div class="header-stat-value" id="headerCompletedCount">0</div>
                <div class="header-stat-label">Completed</div>
            </div>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            
            <div class="topic-filter">
                <div class="filter-label">Filter by Topic</div>
                <select class="filter-select" id="topicFilter">
                    <option value="all">All Topics (250)</option>
                    <option value="Basics">Basics (25)</option>
                    <option value="Variables">Variables & Data Types (20)</option>
                    <option value="Strings">Strings (25)</option>
                    <option value="Lists">Lists (25)</option>
                    <option value="Tuples">Tuples (15)</option>
                    <option value="Dictionaries">Dictionaries (20)</option>
                    <option value="Sets">Sets (15)</option>
                    <option value="Control Flow">Control Flow (25)</option>
                    <option value="Functions">Functions (25)</option>
                    <option value="List Comprehensions">List Comprehensions (15)</option>
                    <option value="File I/O">File I/O (10)</option>
                    <option value="Exception Handling">Exception Handling (10)</option>
                    <option value="OOP">Object-Oriented Programming (20)</option>
                </select>
            </div>
            
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search exercises...">
            </div>
            
            <div class="progress-section">
                <div class="progress-header">
                    <span class="progress-label">Your Progress</span>
                    <span class="progress-count" id="progressCount">0/250</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="question-list" id="questionList"></div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="question-panel">
                <div class="question-title">
                    <h2 id="questionTitle">Loading...</h2>
                    <span class="difficulty-badge beginner" id="difficultyBadge">Beginner</span>
                </div>
                <p class="question-text" id="questionText">Select an exercise from the sidebar to begin.</p>
                
                <div class="hint-section" id="hintSection" style="display: none;">
                    <button class="hint-toggle" onclick="toggleHint()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        Show Hint
                    </button>
                    <div class="hint-content" id="hintContent"></div>
                </div>
            </div>
            
            <div class="editor-panel">
                <div class="editor-header">
                    <div class="editor-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 18 22 12 16 6"/>
                            <polyline points="8 6 2 12 8 18"/>
                        </svg>
                        <h3>Code Editor</h3>
                        <span class="status-badge online">
                            <span class="status-dot"></span>
                            Online Compiler
                        </span>
                    </div>
                    <div class="editor-actions">
                        <button class="btn btn-secondary" onclick="resetCode()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                <path d="M3 3v5h5"/>
                            </svg>
                            Reset
                        </button>
                        <button class="btn btn-solution" id="solutionBtn" onclick="toggleSolution()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            Show Solution
                        </button>
                        <button class="btn btn-run" onclick="runCode()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            Run Code
                        </button>
                    </div>
                </div>
                
                <textarea id="codeEditor" class="code-editor" placeholder="# Write your Python code here...&#10;# Press 'Run Code' to execute" spellcheck="false"></textarea>
                
                <div class="output-panel">
                    <div class="output-header">
                        <span class="output-title">Output</span>
                        <span class="output-status" id="outputStatus" style="display: none;"></span>
                    </div>
                    <div class="output-box" id="outputBox">Click "Run Code" to execute your Python code...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Comprehensive 250 Python exercises
        const questions = [
            // ==================== BASICS (1-25) ====================

            {id: 146, topic: "Control Flow", title: "Simple If", difficulty: "Beginner", question: "Check if 10 is greater than 5 and print 'Yes' if true.", hint: "Use if statement.", solution: "if 10 > 5:\n    print('Yes')"},
            {id: 147, topic: "Control Flow", title: "If-Else", difficulty: "Beginner", question: "Check if x=15 is even or odd.", hint: "Use if-else with % operator.", solution: "x = 15\nif x % 2 == 0:\n    print('Even')\nelse:\n    print('Odd')"},
            {id: 148, topic: "Control Flow", title: "If-Elif-Else", difficulty: "Beginner", question: "Grade a score of 85: A(>=90), B(>=80), C(>=70), F(<70).", hint: "Use elif for multiple conditions.", solution: "score = 85\nif score >= 90:\n    print('A')\nelif score >= 80:\n    print('B')\nelif score >= 70:\n    print('C')\nelse:\n    print('F')"},
            {id: 149, topic: "Control Flow", title: "Nested If", difficulty: "Intermediate", question: "Check if x=10 is positive, and if so, check if it's even.", hint: "Put if inside another if.", solution: "x = 10\nif x > 0:\n    print('Positive')\n    if x % 2 == 0:\n        print('Even')"},
            {id: 150, topic: "Control Flow", title: "Logical And", difficulty: "Beginner", question: "Check if x=15 is between 10 and 20 (inclusive).", hint: "Use 'and' operator.", solution: "x = 15\nif x >= 10 and x <= 20:\n    print('In range')"},
            {id: 151, topic: "Control Flow", title: "Logical Or", difficulty: "Beginner", question: "Check if x=5 is less than 3 or greater than 4.", hint: "Use 'or' operator.", solution: "x = 5\nif x < 3 or x > 4:\n    print('Outside middle range')"},
            {id: 152, topic: "Control Flow", title: "Logical Not", difficulty: "Beginner", question: "Check if x=True is not True.", hint: "Use 'not' operator.", solution: "x = True\nif not x:\n    print('x is False')\nelse:\n    print('x is True')"},
            {id: 153, topic: "Control Flow", title: "Ternary Operator", difficulty: "Intermediate", question: "Use ternary to set result to 'Even' or 'Odd' based on x=7.", hint: "Use: value_if_true if condition else value_if_false", solution: "x = 7\nresult = 'Even' if x % 2 == 0 else 'Odd'\nprint(result)"},
            {id: 154, topic: "Control Flow", title: "For Loop", difficulty: "Beginner", question: "Print numbers 1 to 5 using a for loop.", hint: "Use for with range().", solution: "for i in range(1, 6):\n    print(i)"},
            {id: 155, topic: "Control Flow", title: "For Loop List", difficulty: "Beginner", question: "Print each fruit in ['apple', 'banana', 'cherry'].", hint: "Iterate directly over list.", solution: "fruits = ['apple', 'banana', 'cherry']\nfor fruit in fruits:\n    print(fruit)"},
            {id: 156, topic: "Control Flow", title: "For with Index", difficulty: "Beginner", question: "Print index and value for ['a', 'b', 'c'].", hint: "Use enumerate().", solution: "letters = ['a', 'b', 'c']\nfor i, letter in enumerate(letters):\n    print(f'{i}: {letter}')"},
            {id: 157, topic: "Control Flow", title: "While Loop", difficulty: "Beginner", question: "Print numbers 1 to 5 using while loop.", hint: "Initialize counter, check condition, increment.", solution: "i = 1\nwhile i <= 5:\n    print(i)\n    i += 1"},
            {id: 158, topic: "Control Flow", title: "Break Statement", difficulty: "Beginner", question: "Stop the loop when i equals 5 while iterating 1-10.", hint: "Use break inside if.", solution: "for i in range(1, 11):\n    if i == 5:\n        break\n    print(i)"},
            {id: 159, topic: "Control Flow", title: "Continue Statement", difficulty: "Beginner", question: "Print numbers 1-5 but skip 3.", hint: "Use continue inside if.", solution: "for i in range(1, 6):\n    if i == 3:\n        continue\n    print(i)"},
            {id: 160, topic: "Control Flow", title: "For-Else", difficulty: "Intermediate", question: "Search for 7 in [1,2,3,4,5], print 'Found' or 'Not found'.", hint: "Use else after for loop.", solution: "numbers = [1, 2, 3, 4, 5]\nfor num in numbers:\n    if num == 7:\n        print('Found')\n        break\nelse:\n    print('Not found')"},
            {id: 161, topic: "Control Flow", title: "Nested Loops", difficulty: "Intermediate", question: "Print a 3x3 grid of asterisks.", hint: "Use nested for loops.", solution: "for i in range(3):\n    for j in range(3):\n        print('*', end=' ')\n    print()"},
            {id: 162, topic: "Control Flow", title: "Sum with Loop", difficulty: "Beginner", question: "Calculate sum of numbers 1 to 100.", hint: "Use accumulator pattern.", solution: "total = 0\nfor i in range(1, 101):\n    total += i\nprint(total)"},
            {id: 163, topic: "Control Flow", title: "Factorial", difficulty: "Intermediate", question: "Calculate factorial of 5 (5!).", hint: "Multiply all numbers 1 to 5.", solution: "n = 5\nfactorial = 1\nfor i in range(1, n + 1):\n    factorial *= i\nprint(factorial)"},
            {id: 164, topic: "Control Flow", title: "Fibonacci", difficulty: "Intermediate", question: "Print first 10 Fibonacci numbers.", hint: "Each number is sum of previous two.", solution: "a, b = 0, 1\nfor _ in range(10):\n    print(a, end=' ')\n    a, b = b, a + b"},
            {id: 165, topic: "Control Flow", title: "Prime Check", difficulty: "Intermediate", question: "Check if 17 is a prime number.", hint: "Prime has no divisors except 1 and itself.", solution: "n = 17\nis_prime = True\nif n < 2:\n    is_prime = False\nelse:\n    for i in range(2, int(n**0.5) + 1):\n        if n % i == 0:\n            is_prime = False\n            break\nprint(f'{n} is prime: {is_prime}')"},
            {id: 166, topic: "Control Flow", title: "FizzBuzz", difficulty: "Intermediate", question: "Print 1-15: 'Fizz' for multiples of 3, 'Buzz' for 5, 'FizzBuzz' for both.", hint: "Check 15 first, then 3, then 5.", solution: "for i in range(1, 16):\n    if i % 15 == 0:\n        print('FizzBuzz')\n    elif i % 3 == 0:\n        print('Fizz')\n    elif i % 5 == 0:\n        print('Buzz')\n    else:\n        print(i)"},
            {id: 167, topic: "Control Flow", title: "Count Vowels", difficulty: "Intermediate", question: "Count vowels in 'Hello World'.", hint: "Loop through string, check each char.", solution: "text = 'Hello World'\nvowels = 'aeiouAEIOU'\ncount = 0\nfor char in text:\n    if char in vowels:\n        count += 1\nprint(f'Vowels: {count}')"},
            {id: 168, topic: "Control Flow", title: "Reverse String Loop", difficulty: "Intermediate", question: "Reverse 'Python' using a loop (not slicing).", hint: "Build new string from end.", solution: "text = 'Python'\nreversed_text = ''\nfor char in text:\n    reversed_text = char + reversed_text\nprint(reversed_text)"},
            {id: 169, topic: "Control Flow", title: "Pattern Printing", difficulty: "Intermediate", question: "Print a right triangle with 5 rows of stars.", hint: "Each row i has i stars.", solution: "for i in range(1, 6):\n    print('*' * i)"},
            {id: 170, topic: "Control Flow", title: "Pass Statement", difficulty: "Beginner", question: "Create an empty for loop that does nothing.", hint: "Use pass as placeholder.", solution: "for i in range(5):\n    pass\nprint('Loop completed')"},
            
            // ==================== FUNCTIONS (171-195) ====================
            {id: 171, topic: "Functions", title: "Simple Function", difficulty: "Beginner", question: "Create a function greet() that prints 'Hello!'.", hint: "Use def keyword.", solution: "def greet():\n    print('Hello!')\n\ngreet()"},
            {id: 172, topic: "Functions", title: "Function with Parameter", difficulty: "Beginner", question: "Create greet(name) that prints 'Hello, {name}!'.", hint: "Add parameter in parentheses.", solution: "def greet(name):\n    print(f'Hello, {name}!')\n\ngreet('Alice')"},
            {id: 173, topic: "Functions", title: "Function Return", difficulty: "Beginner", question: "Create add(a, b) that returns sum of a and b.", hint: "Use return statement.", solution: "def add(a, b):\n    return a + b\n\nresult = add(5, 3)\nprint(result)"},
            {id: 174, topic: "Functions", title: "Multiple Parameters", difficulty: "Beginner", question: "Create calc(a, b, c) that returns a + b * c.", hint: "Use multiple parameters.", solution: "def calc(a, b, c):\n    return a + b * c\n\nprint(calc(1, 2, 3))"},
            {id: 175, topic: "Functions", title: "Default Parameters", difficulty: "Beginner", question: "Create greet(name='World') with default value.", hint: "Use = in parameter.", solution: "def greet(name='World'):\n    print(f'Hello, {name}!')\n\ngreet()\ngreet('Alice')"},
            {id: 176, topic: "Functions", title: "Keyword Arguments", difficulty: "Beginner", question: "Call a function using keyword arguments.", hint: "Use name=value when calling.", solution: "def describe_pet(animal, name):\n    print(f'I have a {animal} named {name}')\n\ndescribe_pet(name='Max', animal='dog')"},
            {id: 177, topic: "Functions", title: "Multiple Returns", difficulty: "Intermediate", question: "Create function that returns both min and max of a list.", hint: "Return multiple values as tuple.", solution: "def min_max(numbers):\n    return min(numbers), max(numbers)\n\nlow, high = min_max([3, 1, 4, 1, 5, 9])\nprint(f'Min: {low}, Max: {high}')"},
            {id: 178, topic: "Functions", title: "Args (*args)", difficulty: "Intermediate", question: "Create sum_all() that accepts any number of arguments.", hint: "Use *args parameter.", solution: "def sum_all(*args):\n    return sum(args)\n\nprint(sum_all(1, 2, 3))\nprint(sum_all(1, 2, 3, 4, 5))"},
            {id: 179, topic: "Functions", title: "Kwargs (**kwargs)", difficulty: "Intermediate", question: "Create print_info() that accepts any keyword arguments.", hint: "Use **kwargs parameter.", solution: "def print_info(**kwargs):\n    for key, value in kwargs.items():\n        print(f'{key}: {value}')\n\nprint_info(name='Alice', age=25, city='NYC')"},
            {id: 180, topic: "Functions", title: "Lambda Function", difficulty: "Intermediate", question: "Create a lambda to square a number.", hint: "Use lambda x: expression.", solution: "square = lambda x: x ** 2\nprint(square(5))"},
            {id: 181, topic: "Functions", title: "Lambda with Filter", difficulty: "Intermediate", question: "Use lambda with filter to get even numbers from [1,2,3,4,5,6].", hint: "filter(lambda, iterable).", solution: "numbers = [1, 2, 3, 4, 5, 6]\nevens = list(filter(lambda x: x % 2 == 0, numbers))\nprint(evens)"},
            {id: 182, topic: "Functions", title: "Lambda with Map", difficulty: "Intermediate", question: "Use lambda with map to square [1, 2, 3, 4, 5].", hint: "map(lambda, iterable).", solution: "numbers = [1, 2, 3, 4, 5]\nsquares = list(map(lambda x: x ** 2, numbers))\nprint(squares)"},
            {id: 183, topic: "Functions", title: "Recursive Function", difficulty: "Intermediate", question: "Create recursive factorial function.", hint: "Function calls itself with smaller input.", solution: "def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(5))"},
            {id: 184, topic: "Functions", title: "Docstring", difficulty: "Beginner", question: "Add a docstring to a function and print it.", hint: "Use triple quotes after def.", solution: 'def greet(name):\n    """Greet a person by name."""\n    print(f\'Hello, {name}!\')\n\nprint(greet.__doc__)\ngreet(\'Alice\')'},
            {id: 185, topic: "Functions", title: "Function as Argument", difficulty: "Intermediate", question: "Create a function that takes another function as argument.", hint: "Functions are first-class objects.", solution: "def apply_operation(func, x):\n    return func(x)\n\ndef double(n):\n    return n * 2\n\nresult = apply_operation(double, 5)\nprint(result)"},
            {id: 186, topic: "Functions", title: "Inner Function", difficulty: "Advanced", question: "Create a function with an inner function.", hint: "Define function inside function.", solution: "def outer(x):\n    def inner(y):\n        return x + y\n    return inner(10)\n\nprint(outer(5))"},
            {id: 187, topic: "Functions", title: "Closure", difficulty: "Advanced", question: "Create a closure that remembers a value.", hint: "Inner function uses outer variable.", solution: "def multiplier(n):\n    def multiply(x):\n        return x * n\n    return multiply\n\ndouble = multiplier(2)\ntriple = multiplier(3)\nprint(double(5))\nprint(triple(5))"},
            {id: 188, topic: "Functions", title: "Global Variable", difficulty: "Intermediate", question: "Modify a global variable inside a function.", hint: "Use global keyword.", solution: "counter = 0\n\ndef increment():\n    global counter\n    counter += 1\n\nincrement()\nincrement()\nprint(counter)"},
            {id: 189, topic: "Functions", title: "Type Hints", difficulty: "Intermediate", question: "Create a function with type hints for parameters and return.", hint: "Use : type and -> type.", solution: "def add(a: int, b: int) -> int:\n    return a + b\n\nresult = add(5, 3)\nprint(result)"},

        let currentQuestion = questions[0];
        let showingSolution = false;
        let completedQuestions = new Set();

        // Load completed questions from localStorage
        try {
            const saved = localStorage.getItem('quanskill_completed');
            if (saved) {
                completedQuestions = new Set(JSON.parse(saved));
            }
        } catch (e) {}

        function saveProgress() {
            try {
                localStorage.setItem('quanskill_completed', JSON.stringify([...completedQuestions]));
            } catch (e) {}
        }

        function updateProgress() {
            const count = completedQuestions.size;
            const total = questions.length;
            const percent = (count / total * 100).toFixed(1);
            document.getElementById('progressCount').textContent = `${count}/${total}`;
            document.getElementById('progressFill').style.width = `${percent}%`;
            // Update header count
            const headerCount = document.getElementById('headerCompletedCount');
            if (headerCount) headerCount.textContent = count;
        }

        function getDifficultyClass(difficulty) {
            return difficulty.toLowerCase();
        }

        function renderQuestionList(filter = 'all', search = '') {
            const listEl = document.getElementById('questionList');
            let filtered = questions;
            
            if (filter !== 'all') {
                filtered = filtered.filter(q => q.topic === filter);
            }
            
            if (search) {
                const searchLower = search.toLowerCase();
                filtered = filtered.filter(q => 
                    q.title.toLowerCase().includes(searchLower) ||
                    q.question.toLowerCase().includes(searchLower) ||
                    q.topic.toLowerCase().includes(searchLower)
                );
            }
            
            listEl.innerHTML = filtered.map(q => `
                <div class="question-item ${currentQuestion.id === q.id ? 'active' : ''} ${completedQuestions.has(q.id) ? 'completed' : ''}" onclick="selectQuestion(${q.id})">
                    <div class="q-header">
                        <span class="q-number">Q${q.id}</span>
                        ${completedQuestions.has(q.id) ? '<span style="color: #10b981;">âœ“</span>' : ''}
                    </div>
                    <div class="q-title">${q.title}</div>
                    <div class="q-meta">
                        <span class="q-topic">${q.topic}</span>
                        <span class="q-difficulty ${getDifficultyClass(q.difficulty)}">${q.difficulty}</span>
                    </div>
                </div>
            `).join('');
        }

        function selectQuestion(id) {
            currentQuestion = questions.find(q => q.id === id);
            showingSolution = false;
            document.getElementById('codeEditor').value = '';
            document.getElementById('outputBox').textContent = 'Click "Run Code" to execute your Python code...';
            document.getElementById('outputBox').className = 'output-box';
            document.getElementById('outputStatus').style.display = 'none';
            updateQuestionDisplay();
            renderQuestionList(
                document.getElementById('topicFilter').value,
                document.getElementById('searchInput').value
            );
        }

        function updateQuestionDisplay() {
            document.getElementById('questionTitle').textContent = `Q${currentQuestion.id}: ${currentQuestion.title}`;
            document.getElementById('questionText').innerHTML = currentQuestion.question;
            
            const badge = document.getElementById('difficultyBadge');
            badge.textContent = currentQuestion.difficulty;
            badge.className = `difficulty-badge ${getDifficultyClass(currentQuestion.difficulty)}`;
            
            // Update hint section
            const hintSection = document.getElementById('hintSection');
            const hintContent = document.getElementById('hintContent');
            if (currentQuestion.hint) {
                hintSection.style.display = 'block';
                hintContent.textContent = currentQuestion.hint;
                hintContent.classList.remove('show');
            } else {
                hintSection.style.display = 'none';
            }
            
            // Update solution button
            const solutionBtn = document.getElementById('solutionBtn');
            solutionBtn.innerHTML = showingSolution ? `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
                Hide Solution
            ` : `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                Show Solution
            `;
        }

        function toggleHint() {
            const content = document.getElementById('hintContent');
            content.classList.toggle('show');
        }

        function toggleSolution() {
            showingSolution = !showingSolution;
            if (showingSolution) {
                document.getElementById('codeEditor').value = currentQuestion.solution;
            } else {
                document.getElementById('codeEditor').value = '';
            }
            updateQuestionDisplay();
        }

        function resetCode() {
            document.getElementById('codeEditor').value = '';
            document.getElementById('outputBox').textContent = 'Click "Run Code" to execute your Python code...';
            document.getElementById('outputBox').className = 'output-box';
            document.getElementById('outputStatus').style.display = 'none';
            showingSolution = false;
            updateQuestionDisplay();
        }

        async function runCode() {
            const code = document.getElementById('codeEditor').value;
            const outputEl = document.getElementById('outputBox');
            const statusEl = document.getElementById('outputStatus');
            
            if (!code.trim()) {
                outputEl.textContent = 'Please write some code first!';
                outputEl.className = 'output-box error';
                statusEl.textContent = 'Empty';
                statusEl.className = 'output-status error';
                statusEl.style.display = 'inline-block';
                return;
            }

            outputEl.textContent = 'â³ Running code...';
            outputEl.className = 'output-box';
            statusEl.textContent = 'Running...';
            statusEl.className = 'output-status running';
            statusEl.style.display = 'inline-block';
            
            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        language: 'python',
                        version: '3.10.0',
                        files: [{
                            content: code
                        }]
                    })
                });

                const result = await response.json();
                
                if (result.run && result.run.output) {
                    outputEl.textContent = result.run.output;
                    outputEl.className = 'output-box success';
                    statusEl.textContent = 'Success';
                    statusEl.className = 'output-status success';
                    
                    // Mark as completed
                    completedQuestions.add(currentQuestion.id);
                    saveProgress();
                    updateProgress();
                    renderQuestionList(
                        document.getElementById('topicFilter').value,
                        document.getElementById('searchInput').value
                    );
                } else if (result.run && result.run.stderr) {
                    outputEl.textContent = 'Error:\n' + result.run.stderr;
                    outputEl.className = 'output-box error';
                    statusEl.textContent = 'Error';
                    statusEl.className = 'output-status error';
                } else {
                    outputEl.textContent = 'âœ“ Program completed successfully (no output)';
                    outputEl.className = 'output-box success';
                    statusEl.textContent = 'Success';
                    statusEl.className = 'output-status success';
                    
                    completedQuestions.add(currentQuestion.id);
                    saveProgress();
                    updateProgress();
                    renderQuestionList(
                        document.getElementById('topicFilter').value,
                        document.getElementById('searchInput').value
                    );
                }
            } catch (error) {
                outputEl.textContent = 'âŒ Error: Unable to connect to online Python compiler.\n\nPlease check your internet connection and try again.\n\n' + error.message;
                outputEl.className = 'output-box error';
                statusEl.textContent = 'Connection Error';
                statusEl.className = 'output-status error';
            }
        }

        // Event listeners
        document.getElementById('topicFilter').addEventListener('change', (e) => {
            renderQuestionList(e.target.value, document.getElementById('searchInput').value);
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderQuestionList(document.getElementById('topicFilter').value, e.target.value);
        });

        // Keyboard shortcut
        document.getElementById('codeEditor').addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });

        // Initialize
        updateQuestionDisplay();
        renderQuestionList();
        updateProgress();
    </script>
